# Local SonarQube analysis (ADR-0004); the server URL is set by the Makefile. The token is never stored here: make sonar-scan uses the global
# analysis token exported as SONAR_TOKEN (~/.config/sonarqube/analysis-token).
sonar.projectKey=retro-blocks
sonar.projectName=retro-blocks
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=120

# The composition root is not unit-tested: it only wires adapters (smoke test planned with brick 5).
sonar.coverage.exclusions=src/app/main.ts

# Accepted: no allocation inside the game loop. ESLint bans for...of in src/ (it allocates an
# iterator below V8's optimizing tier). Scoped to rule S4138, the counterpart of that ban.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**
